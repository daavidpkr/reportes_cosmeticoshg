name: cosmeticos_hg_reportes
description: "Sistema de reportes de ventas para Cosméticos HG."
publish_to: 'none'
version: 1.0.3+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.9
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  desktop_drop: ^0.7.1
  web: ^1.1.1
  pdf: ^3.12.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - env
    - web/icons/Icon-192.png
